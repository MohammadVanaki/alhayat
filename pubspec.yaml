name: alhayat
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  get: ^4.7.3
  get_storage: ^2.1.1
  lottie: ^3.3.1
  gap: ^3.0.1
  flutter_localizations:
    sdk: flutter
  flutter_downloader: ^1.12.0
  audioplayers: ^6.5.1
  open_filex: ^4.7.0
  permission_handler: ^12.0.1
  page_transition: ^2.2.1
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.2
  animated_bottom_navigation_bar: ^1.4.0
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.1
  screen_protector: ^1.4.2+1
  path: ^1.9.1
  http: ^1.6.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0
  liquid_glass_renderer: ^0.1.1-dev.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/svgs/
    - assets/lottiefiles/
  fonts:
    - family: Bloomberg
      fonts:
        - asset: ./assets/fonts/BloombergArabicBetav4-Regular.ttf
          weight: 400
        - asset: ./assets/fonts/BloombergArabicBetav4-Bold.ttf
          weight: 700